<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Волна 38: фавиконка. Тот же язык, что и line-art иллюстрации парка (ParkCraneArt) —
       упрощённый силуэт стрелы крана с крюком, жёлтый на чёрном, брутализм: жёсткие
       линии, без скруглений, без градиентов. Работает как SVG-фавиконка в современных
       браузерах без зависимости от загрузки шрифта (важно — фавиконки рендерятся раньше
       основного CSS/веб-шрифтов страницы). -->
  <rect width="32" height="32" fill="#0D0D0D"/>
  <!-- Мачта -->
  <rect x="6" y="8" width="3" height="20" fill="#FFD600"/>
  <!-- Стрела -->
  <path d="M9 10 L27 6 L27 9 L9 13 Z" fill="#FFD600"/>
  <!-- Трос -->
  <line x1="25" y1="7.5" x2="25" y2="19" stroke="#FFD600" stroke-width="1.6"/>
  <!-- Крюк -->
  <path d="M25 19 q0 4 -3.4 4 q-3 0 -3 -2.6" fill="none" stroke="#FFD600" stroke-width="2.2" stroke-linecap="round"/>
</svg>
